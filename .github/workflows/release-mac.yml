name: Build macOS release assets

on:
  workflow_dispatch:
    inputs:
      tag:
        description: GitHub release tag to upload into
        required: true
        default: v1.0.1

jobs:
  mac:
    name: macOS build
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm deps
        run: npm ci

      - name: Install ffmpeg + MKVToolNix
        run: brew install ffmpeg mkvtoolnix

      - name: Fetch helpers + package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run pack:mac

      - name: List artifacts
        run: ls -lah release/

      - name: Upload to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          shopt -s nullglob
          files=(release/SimpleDefaultAudio-mac-*.zip release/SimpleDefaultAudio-mac-*.dmg)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No mac artifacts found"
            ls -lah release/ || true
            exit 1
          fi
          gh release upload "${{ inputs.tag }}" "${files[@]}" --clobber
